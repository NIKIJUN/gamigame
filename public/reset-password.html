<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Gamigame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset-password.css" />
</head>
<body>

  <div class="auth-bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <div class="auth-card">

      <a href="/" class="brand">
        <span class="brand-icon">🎮</span>
        <span class="brand-name">Gamigame</span>
      </a>

      <div class="page-icon">🔑</div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-sub">Buat password baru untuk akun kamu</p>

      <div class="alert-box hidden" id="alertBox" role="alert"></div>

      <form id="resetForm" novalidate>

        <div class="field">
          <label for="password">Password Baru</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Minimal 8 karakter"
              autocomplete="new-password"
              required
            />
            <button type="button" class="eye-btn" id="togglePassword" aria-label="Tampilkan password">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-bar" id="strengthBar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>

        <div class="field">
          <label for="confirmPassword">Konfirmasi Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Ulangi password baru"
              autocomplete="new-password"
              required
            />
            <button type="button" class="eye-btn" id="toggleConfirm" aria-label="Tampilkan konfirmasi password">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="resetBtn">
          <span id="btnText">Simpan Password Baru</span>
          <span id="btnLoader" class="loader hidden"></span>
        </button>

      </form>

      <p class="switch-auth">
        <a href="/login">Kembali ke Login</a>
      </p>

    </div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
