<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Daftar - Gamigame</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/css/register.css" />
</head>
<body>
  <main class="register-page">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-sm-11 col-md-8 col-lg-6 col-xl-5">
          <div class="card register-card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="brand-icon mb-3">
                  G
                </div>
                <h1 class="h3 fw-bold mb-1">Buat Akun Gamigame</h1>
                <p class="text-muted mb-0">
                  Daftar sebagai siswa atau guru
                </p>
              </div>

              <div id="alertBox" class="alert d-none" role="alert"></div>

              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label for="role" class="form-label">Daftar Sebagai</label>
                  <select class="form-select form-select-lg" id="role" name="role" required>
                    <option value="">Pilih role</option>
                    <option value="student">Siswa</option>
                    <option value="teacher">Guru</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="full_name" class="form-label">Nama Lengkap</label>
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="full_name"
                    name="full_name"
                    placeholder="Masukkan nama lengkap"
                    required
                  />
                  <div class="form-text">
                    Minimal 3 karakter, maksimal 100 karakter.
                  </div>
                </div>

                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input
                    type="text"
                    class="form-control form-control-lg"
                    id="username"
                    name="username"
                    placeholder="contoh: fahmira_01"
                    required
                  />
                  <div class="form-text">
                    Hanya boleh huruf, angka, dan underscore.
                  </div>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control form-control-lg"
                    id="email"
                    name="email"
                    placeholder="nama@email.com"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>

                  <div class="input-group input-group-lg">
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      placeholder="Masukkan password"
                      required
                    />
                    <button
                      class="btn btn-outline-secondary"
                      type="button"
                      id="togglePassword"
                    >
                      Lihat
                    </button>
                  </div>

                  <div class="form-text">
                    Minimal 8 karakter, harus ada huruf kapital dan angka.
                  </div>
                </div>

                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">Konfirmasi Password</label>

                  <input
                    type="password"
                    class="form-control form-control-lg"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Ulangi password"
                    required
                  />
                </div>

                <button
                  type="submit"
                  class="btn btn-primary btn-lg w-100"
                  id="registerButton"
                >
                  Daftar
                </button>
              </form>

              <div class="text-center mt-4">
                <p class="mb-0 text-muted">
                  Sudah punya akun?
                  <a href="/login">Login di sini</a>
                </p>
              </div>
            </div>
          </div>

          <p class="text-center text-white-50 small mt-4 mb-0">
            &copy; 2026 Gamigame. All rights reserved.
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/register.js"></script>
</body>
</html>
