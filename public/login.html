<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Gamigame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>

  <div class="auth-bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <div class="auth-card">

      <a href="/" class="brand">
        <span class="brand-icon">🎮</span>
        <span class="brand-name">Gamigame</span>
      </a>

      <h1 class="auth-title">Selamat Datang!</h1>
      <p class="auth-sub">Pilih peranmu, lalu masuk ke akun</p>

      <div class="role-tabs">
        <button class="role-tab" data-role="student" type="button">
          🎓 Siswa
        </button>
        <button class="role-tab" data-role="teacher" type="button">
          👩‍🏫 Guru
        </button>
        <span class="tab-indicator"></span>
      </div>

      <div class="alert-box hidden" id="alertBox" role="alert"></div>

      <form id="loginForm" novalidate>
        <input type="hidden" id="role" value="student" />

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="eye-btn" id="togglePassword" aria-label="Tampilkan password">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">
          <span id="btnText">Masuk</span>
          <span id="btnLoader" class="loader hidden"></span>
        </button>
      </form>

      <p class="switch-auth">
        Belum punya akun?
        <a href="/register" id="registerLink">Daftar di sini</a>
      </p>

    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
